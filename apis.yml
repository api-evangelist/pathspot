aid: pathspot
name: PathSpot
description: >-
  PathSpot Technologies provides a health-and-safety operating system for restaurants, commercial
  kitchens, food manufacturers, cafeterias, and hospitality venues. Its flagship HandScanner uses
  light-based spectroscopy to detect harmful contaminants on employees' hands in about two seconds
  after washing and drying. Alongside the scanner, PathSpot's SafetySuite bundles real-time
  temperature monitoring (PowerTemp), digital task management (PowerTasks), and food labeling
  (PowerLabels), rolling the data up into the SafetySuite Hub dashboard with analytics, automated
  compliance reporting, email reports, text alerts, and optional API-based data integration. PathSpot
  markets API integration as a data-delivery feature of SafetySuite but publishes no public developer
  portal, API reference, OpenAPI, or SDKs as of this profile.
